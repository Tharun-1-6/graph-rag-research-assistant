<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GraphRAG Research Assistant</title>
    <meta name="description" content="Intelligent RAG assistant combining Knowledge Graph structures and semantic search vector databases.">
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- CSS Stylesheet -->
    <link rel="stylesheet" href="/static/style.css">
    <!-- Marked JS for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <!-- Toast Notification Overlay -->
    <div class="toast-notification" id="toast-notification" style="display: none;">
        <span class="toast-icon">✨</span>
        <span class="toast-message" id="toast-message"></span>
    </div>

    <!-- Glowing Background Network BG -->
    <div class="network-bg">
        <div class="glowing-node node-1"></div>
        <div class="glowing-node node-2"></div>
        <div class="glowing-node node-3"></div>
        <div class="glowing-line line-1"></div>
    </div>

    <!-- Main Central Container -->
    <main class="chat-wrapper">
        <div class="chat-container">
            <!-- Header bar -->
            <header class="chat-header">
                <div class="brand-group">
                    <span class="brand-bullet"></span>
                    <div class="brand-text">
                        <h1 class="brand-title">GraphRAG <span class="accent-text">Assistant</span></h1>
                        <span class="brand-status">Research Assistant Active</span>
                    </div>
                    <div class="model-selector">
                        <select id="model-select" class="model-select-dropdown">
                            <option value="gemini" selected>🤖 Gemini 2.5 Flash</option>
                            <option value="llama-3.3-70b-versatile">⚡ Llama 3.3 70B</option>
                            <option value="llama-3.1-8b-instant">⚡ Llama 3.1 8B</option>
                            <option value="mixtral-8x7b-32768">⚡ Mixtral 8x7B</option>
                            <option value="gemma2-9b-it">⚡ Gemma 2 9B</option>
                        </select>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="action-btn" id="clear-chat-btn" title="Clear Chat History">
                        <svg viewBox="0 0 24 24" width="16" height="16">
                            <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" fill="currentColor"/>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Chat message log viewport -->
            <div class="chat-viewport" id="chat-viewport">
                <!-- Welcome screen shown when empty -->
                <div class="welcome-screen" id="welcome-screen">
                    <div class="welcome-icon">🧠</div>
                    <h2 class="welcome-title">Ask GraphRAG</h2>
                    <p class="welcome-subtitle">Ask questions about your uploaded scientific papers. The orchestrator will dynamically route your query using hybrid Vector and Knowledge Graph indexes.</p>
                </div>
            </div>

            <!-- Input area -->
            <footer class="chat-footer">
                <form class="input-form" id="input-form">
                    <input type="text" class="chat-input" id="chat-input" placeholder="Ask a question about the papers..." autocomplete="off" required>
                    <button type="submit" class="send-btn" id="send-btn">
                        <svg viewBox="0 0 24 24" width="18" height="18">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" fill="currentColor"/>
                        </svg>
                    </button>
                </form>
            </footer>
        </div>
    </main>

    <!-- JS script -->
    <script src="/static/app.js"></script>
</body>
</html>
